name: API checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: companymgmt
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: companymgmt_test
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U companymgmt" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://companymgmt:ci_password@localhost:5432/companymgmt_test
      TEST_DATABASE_URL: postgresql://companymgmt:ci_password@localhost:5432/companymgmt_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run build
      - run: npm run db:deploy
      - run: npm run test:integration
